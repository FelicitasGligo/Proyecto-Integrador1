<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <header>
        <div class="header-principal">
            <a href="./index.html"><img src="./images/logomagnia2.png" alt="Logo Magnia"></a>
            <form class="form-buscador" action="search-results.html" method="get">
                <label class="buscador">
                    <input class="barra" type="text" name="Buscar" placeholder="Buscá un producto">
                </label>
                <button type="submit">Buscar</button>
            </form>
            <div class="error-buscador"></div>
            <nav class="nav-superior">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li class="item-registro"><a href="register.html">Registrarse</a></li>
                    <li class="item-login"><a href="login.html">Iniciar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="main-register">
        <nav class="nav-categorias">
            <ul></ul>
        </nav>
        <div class="register-container">
        <h1>Registrate acá</h1>
        <form class="form-register" action="./index.html" method="get">
            <div>
                <label for="email">Email</label>
                <input id="email" type="text" name="email" value="">
                <div class="error-register error-email"></div>
            </div>
            <div>
                <label for="contrasena">Contraseña</label>
                <input id="contrasena" type="password" name="contrasena">
                <div class="error-register error-contrasena"></div>
            </div>
            <div>
                <label for="repetir-contrasena">Repetir contraseña</label>
                <input type="password" id="repetirContrasena" name="repetirContrasena">
                <div class="error-register error-repetir"></div>
            </div>
            <div class="terminos">
                <input class="checkbox" type="checkbox" id="terminos" name="terminos" value="acepto">
                <label for="terminos">Acepto términos y condiciones</label>
            </div>
            <div>
                <button type="submit">Registrarme</button>
            </div>
            <a href="./login.html">Ya tengo una cuenta</a>
        </form>
        </div>
    </main>
    <footer>
        <p>Sitio creado por Melina Piancatelli, Megan Morrison Fell y Felicitas Gligo.</p>
    </footer>
    <script src="./js/register.js"></script>
    <script src="./js/saludo.js"></script>
</body>
</html>
