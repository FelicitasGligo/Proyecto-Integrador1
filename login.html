<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <header>
        <div class="header-principal">
            <a href="./index.html"><img src="./images/logomagnia2.png" alt="Logo Magnia"></a>
            <form class="form-buscador" action="search-results.html" method="get">
                <label class="buscador">
                    <input class="barra" type="text" name="Buscar" placeholder="Buscá un producto">
                </label>
                <button type="submit">Buscar</button>
            </form>
            <div class="error-buscador"></div>
            <nav class="nav-superior">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li class="item-registro"><a href="register.html">Registrarse</a></li>
                    <li class="item-login"><a href="login.html">Iniciar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="main-login">
        
        <div class="login-container">
            <h1>Login</h1>
            <form class="form-login" action="./index.html" method="get">
                <div>
                    <label for="email">Email</label>
                    <input id="email" type="text" name="email" value="">
                    <div class="error-login error-email"></div>
                </div>
                <div>
                    <label for="contrasena">Contraseña </label>
                    <input type="password" id="contrasena" name="contrasena">
                    <div class="error-login error-contrasena"></div>
                </div>
                <div>
                    <button type="submit">Ingresar</button>
                </div>
                <a href="./register.html">No tengo cuenta</a>
            </form>
        </div>
    </main>
    <footer>
        <p>Sitio creado por Melina Piancatelli, Megan Morrison Fell y Felicitas Gligo.</p>
    </footer>
    <script src="./js/login.js"></script>
</body>
</html>
